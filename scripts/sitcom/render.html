<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url(fonts/fredoka.woff2) format("woff2"); font-weight: 300 700; }
@font-face { font-family: Hand; src: url(fonts/patrick.woff2) format("woff2"); }
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const W = 1280, H = 720, SCALE = 1, GROUND = 655;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let TL = null;

// ---------- utils ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0 ? 0 : k > 1 ? 1 : 1 - Math.pow(1 - k, 3);
const back = k => { k = clamp(k, 0, 1); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }
function fillC(c) { ctx.fillStyle = c; ctx.fill(); }
function strokeC(c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); }
function text(s, x, y, size, color, opts = {}) {
  ctx.font = `${opts.weight || 700} ${size}px ${opts.font || 'Fredoka'}`;
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = opts.base || 'middle';
  if (opts.stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = opts.stroke; ctx.lineWidth = opts.sw || size * 0.18; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size, font = 'Fredoka', weight = 600) {
  ctx.font = `${weight} ${size}px ${font}`;
  const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) { const tr = cur ? cur + ' ' + w : w; if (ctx.measureText(tr).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tr; }
  if (cur) lines.push(cur); return lines;
}

// ---------- characters ----------
const CH = {
  tara:    { name: 'TARA', color: '#a78bfa', skin: '#b67c55', hair: '#1c1310', top: '#7c5cff', top2: '#6246ea', legs: '#2f3a6b', h: 0.9, glasses: 'round', hairStyle: 'pony' },
  mum:     { name: 'MUM', color: '#2dd4bf', skin: '#c48c62', hair: '#21140f', top: '#0fa596', top2: '#0b8a7d', legs: '#ead7b7', h: 0.96, hairStyle: 'bun', earrings: true, long: true },
  dad:     { name: 'DAD', color: '#fbbf24', skin: '#a87150', hair: '#2a211d', top: '#f59e0b', top2: '#d97f06', legs: '#7a6a55', h: 1.04, glasses: 'rect', hairStyle: 'short', mo: true, belly: true },
  pablo:   { name: 'PABLO', color: '#f87171', skin: '#e3b58c', hair: '#2b1a10', top: '#f8fafc', top2: '#dc2626', legs: '#1f2937', h: 0.93, hairStyle: 'curly', cuff: '#dc2626' },
  lola:    { name: 'LOLA', color: '#4ade80', parrot: true, monster: true, h: 1.0 },
  teacher: { name: 'SEÑOR GARCÍA', color: '#f472b6', skin: '#d9a77f', hair: '#3f2a1d', top: '#1e3a8a', top2: '#172554', legs: '#334155', h: 1.0, glasses: 'rect', hairStyle: 'short', beard: true },
  uncle:   { name: 'UNCLE HOCK', color: '#60a5fa', skin: '#d6a074', hair: '#9ca3af', top: '#f1f5f9', top2: '#cbd5e1', legs: '#1f2937', h: 1.0, hairStyle: 'short', belly: true, apron: '#2563eb' },
};
// head height above the ground (for cameras): humans scale with h, Lola sits on her perch
const headOff = id => CH[id].parrot ? 400 : 370 * CH[id].h;

function blinkAt(t, seed) {
  const period = 2.6 + hash(seed) * 2.2; const ph = (t + hash(seed + 3) * 5) % period; return ph < 0.12;
}

function brows(mood) {
  // returns [innerYoffset, outerYoffset] per brow; positive = down
  return { neutral: [0, 0], happy: [-2, -1], excited: [-6, -3], deadpan: [3, 3], annoyed: [5, -2], shock: [-9, -7], smug: [2, -4],
    thinking: [-3, 2], worried: [-5, 3], sad: [-5, 4], determined: [5, -1], teach: [-2, -2], bored: [4, 4], eyeroll: [2, 2] }[mood] || [0, 0];
}

function drawHuman(id, x, st) {
  const c = CH[id], s = c.h, t = st.t;
  const talk = st.mouth || 0;
  const bob = Math.sin(t * 1.7 + x) * 1.5 + (st.talking ? Math.sin(t * 9) * talk * 2.5 : 0);
  ctx.save(); ctx.translate(x, GROUND); ctx.scale(s, s);
  // shadow
  ell(0, 2, 70, 12); fillC('rgba(0,0,0,0.18)');
  // legs
  ctx.fillStyle = c.legs;
  if (c.long) { rr(-46, -150, 92, 150, 14); ctx.fill(); }
  else { rr(-38, -150, 32, 150, 12); ctx.fill(); rr(6, -150, 32, 150, 12); ctx.fill(); }
  ctx.fillStyle = '#2a2a33'; rr(-44, -14, 42, 16, 8); ctx.fill(); rr(2, -14, 42, 16, 8); ctx.fill();
  ctx.translate(0, bob);
  // torso
  const bw = c.belly ? 64 : 54;
  ctx.fillStyle = c.top; rr(-bw, -300, bw * 2, 170, 40); ctx.fill();
  if (c.long) { ctx.fillStyle = c.top; rr(-58, -170, 116, 95, 20); ctx.fill(); ctx.fillStyle = c.top2; rr(-58, -100, 116, 10, 4); ctx.fill(); }
  if (id === 'tara') { ctx.fillStyle = c.top2; rr(-30, -215, 60, 40, 10); ctx.fill(); strokeC('#ffffff55', 2); text('Ñ', 0, -195, 26, '#fff'); }
  if (id === 'pablo') { // white-and-red football shirt
    ctx.fillStyle = c.top2; ctx.beginPath(); ctx.moveTo(-24, -300); ctx.lineTo(0, -266); ctx.lineTo(24, -300); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-15, -300); ctx.lineTo(0, -278); ctx.lineTo(15, -300); ctx.fill();
    ctx.fillStyle = c.top2; rr(-bw, -146, bw * 2, 16, 6); ctx.fill(); ctx.fillRect(-bw + 4, -232, 10, 70); ctx.fillRect(bw - 14, -232, 10, 70);
    text('10', 6, -205, 46, c.top2, { stroke: '#fff', sw: 4 });
    circ(-20, -262, 9); fillC('#dc2626'); circ(-20, -262, 4); fillC('#fff'); }
  if (id === 'teacher') { // blazer, white shirt, red-and-yellow tie
    ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.moveTo(-26, -300); ctx.lineTo(0, -215); ctx.lineTo(26, -300); ctx.fill();
    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.moveTo(-7, -296); ctx.lineTo(7, -296); ctx.lineTo(9, -232); ctx.lineTo(0, -220); ctx.lineTo(-9, -232); ctx.fill();
    ctx.fillStyle = '#facc15'; ctx.fillRect(-7, -272, 14, 9); ctx.fillRect(-8, -250, 16, 9); }
  if (id === 'dad') { ctx.fillStyle = c.top2; ctx.beginPath(); ctx.moveTo(-20, -300); ctx.lineTo(0, -262); ctx.lineTo(20, -300); ctx.fill(); }
  if (c.apron) { ctx.fillStyle = c.apron; rr(-44, -262, 88, 132, 12); ctx.fill(); ctx.fillStyle = '#fff'; text('HOCK', 0, -220, 15, '#fff'); }
  // arms
  const gest = st.talking && ['teach', 'excited', 'shock', 'smug', 'happy', 'thinking', 'annoyed'].includes(st.mood);
  const armR = gest ? -1.1 + Math.sin(t * 3.2) * 0.35 * (0.4 + talk) : 0.12 + Math.sin(t * 1.3) * 0.03;
  const armL = st.mood === 'shock' ? -2.3 : st.mood === 'thinking' ? -2.6 : 0.12;
  const arm = (side, ang) => {
    ctx.save(); ctx.translate(side * (bw - 8), -280); ctx.rotate(side * -ang);
    ctx.fillStyle = c.top; rr(-15, -6, 30, 92, 15); ctx.fill();
    if (c.cuff) { ctx.fillStyle = c.cuff; rr(-15, 30, 30, 12, 4); ctx.fill(); }
    circ(0, 92, 13); fillC(c.skin); ctx.restore();
  };
  arm(-1, armL); arm(1, armR);
  // props
  const PX = bw + 30, PY = -230;
  if (st.prop === 'phone') { ctx.save(); ctx.translate(PX, PY - Math.sin(t*3)*4); ctx.rotate(-0.2); ctx.fillStyle = '#1f2937'; rr(-16, -28, 32, 56, 6); ctx.fill(); ctx.fillStyle = '#22c55e'; rr(-12, -22, 24, 40, 3); ctx.fill(); text('¡Hola!', 0, -2, 8, '#fff'); ctx.restore(); }
  if (st.prop === 'tablet') { ctx.save(); ctx.translate(-bw - 20, -205); ctx.rotate(0.15); ctx.fillStyle = '#111827'; rr(-40, -30, 80, 60, 6); ctx.fill(); ctx.fillStyle = '#e0f2fe'; rr(-35, -25, 70, 50, 3); ctx.fill();
    ctx.fillStyle = '#dc2626'; ctx.fillRect(-30, -18, 60, 10); ctx.fillStyle = '#facc15'; ctx.fillRect(-30, -8, 60, 14); ctx.fillStyle = '#dc2626'; ctx.fillRect(-30, 6, 60, 10); ctx.restore(); }
  if (st.prop === 'book') { ctx.save(); ctx.translate(PX, PY); ctx.rotate(-0.15); ctx.fillStyle = '#b91c1c'; rr(-26, -34, 52, 68, 4); ctx.fill(); ctx.fillStyle = '#fde047'; ctx.fillRect(-20, -26, 40, 6); text('ESPAÑOL', 0, 4, 9, '#fde047'); ctx.restore(); }
  if (st.prop === 'plate') { ctx.save(); ctx.translate(PX, PY + 10); ell(0, 0, 44, 14); fillC('#f8fafc'); ell(0, -6, 30, 12); fillC('#f59e0b'); circ(-8, -10, 5); fillC('#16a34a'); circ(10, -9, 4); fillC('#dc2626'); ctx.restore(); }
  if (st.prop === 'map') { ctx.save(); ctx.translate(PX, PY); ctx.rotate(-0.1); ctx.fillStyle = '#fef3c7'; rr(-40, -30, 80, 60, 3); ctx.fill(); ctx.beginPath(); ctx.moveTo(-30, 18); ctx.lineTo(-5, -10); ctx.lineTo(25, 8); ctx.setLineDash([5, 4]); strokeC('#dc2626', 3); ctx.setLineDash([]); text('N', 28, -18, 12, '#1e3a8a'); ctx.restore(); }
  if (st.prop === 'ball') { ctx.save(); ctx.translate(PX, PY - Math.abs(Math.sin(t * 4)) * 14); ctx.rotate(t * 2); circ(0, 0, 24); fillC('#fff'); strokeC('#111', 2);
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; circ(Math.cos(a) * 15, Math.sin(a) * 15, 5); fillC('#111'); } circ(0, 0, 6); fillC('#111'); ctx.restore(); }
  if (st.prop === 'umbrella') { ctx.save(); ctx.translate(PX - 10, PY - 70); ctx.rotate(0.12 + Math.sin(t * 2) * 0.04); ctx.fillStyle = '#78716c'; ctx.fillRect(-3, 0, 6, 110);
    ctx.beginPath(); ctx.arc(0, 0, 70, Math.PI, 0); ctx.fillStyle = '#2563eb'; ctx.fill(); for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(-52 + i * 35, 0, 17.5, Math.PI, 0); fillC('#fde9cc'); } ctx.restore(); }
  if (st.prop === 'broom') { ctx.save(); ctx.translate(PX - 4, PY - 40); ctx.rotate(0.25 + Math.sin(t * 4) * 0.12); ctx.fillStyle = '#a16207'; ctx.fillRect(-3, -40, 6, 170); ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.moveTo(-8, 125); ctx.lineTo(8, 125); ctx.lineTo(26, 175); ctx.lineTo(-26, 175); ctx.fill(); ctx.restore(); }
  if (st.prop === 'clock') { ctx.save(); ctx.translate(PX, PY); ctx.rotate(Math.sin(t * 20) * 0.06); circ(0, 0, 26); fillC('#dc2626'); circ(0, 0, 20); fillC('#fff'); circ(-18, -24, 8); fillC('#dc2626'); circ(18, -24, 8); fillC('#dc2626');
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -14); ctx.moveTo(0, 0); ctx.lineTo(10, 4); strokeC('#111', 3); ctx.restore(); }
  if (st.prop === 'guitar') { ctx.save(); ctx.translate(PX - 30, PY + 30); ctx.rotate(-0.9); ctx.fillStyle = '#b45309'; ell(0, 30, 30, 34); ctx.fill(); ell(0, -16, 23, 24); ctx.fill(); circ(0, 8, 9); fillC('#3f1d0b');
    ctx.fillStyle = '#44403c'; ctx.fillRect(-4, -100, 8, 80); ctx.fillStyle = '#292524'; rr(-7, -120, 14, 22, 3); ctx.fill(); ctx.restore(); }
  // neck + head
  ctx.fillStyle = c.skin; rr(-14, -318, 28, 30, 8); ctx.fill();
  const hx = 0, hy = -372, hr = 58;
  // hair back
  if (c.hairStyle === 'pony') { ctx.save(); ctx.translate(hx + 46, hy - 30); ctx.rotate(0.5 + Math.sin(t * 2.2) * 0.12); ctx.fillStyle = c.hair; ell(18, 32, 18, 46, 0.2); ctx.fill(); ctx.restore(); ctx.fillStyle = '#f472b6'; circ(hx + 50, hy - 34, 7); ctx.fill(); }
  if (c.hairStyle === 'bun') { circ(hx, hy - 62, 26); fillC(c.hair); }
  if (c.hairStyle === 'curly') { ctx.fillStyle = c.hair; for (let i = -4; i <= 4; i++) { circ(hx + i * 14, hy - 50 + Math.abs(i) * Math.abs(i) * 2.6, 17); ctx.fill(); } }
  if (c.hairStyle === 'bob') { ctx.fillStyle = c.hair; rr(hx - hr - 8, hy - 30, 2 * hr + 16, 78, 26); ctx.fill(); }
  if (c.hairStyle === 'mumlong') {}
  circ(hx, hy, hr); fillC(c.skin);
  // ears
  ell(hx - hr + 2, hy + 4, 9, 13); fillC(c.skin); ell(hx + hr - 2, hy + 4, 9, 13); fillC(c.skin);
  if (c.earrings) { circ(hx - hr + 2, hy + 22, 5); fillC('#facc15'); circ(hx + hr - 2, hy + 22, 5); fillC('#facc15'); }
  // hair front
  ctx.fillStyle = c.hair;
  if (c.hairStyle === 'cap') { ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(hx, hy - 8, hr + 2, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); rr(hx - 10, hy - 30, 90, 14, 7); ctx.fill(); }
  else {
    if (c.hairStyle === 'curly') { ctx.save(); ctx.beginPath(); ctx.rect(hx - 80, hy - 120, 160, 92); ctx.clip(); circ(hx, hy - 4, hr + 3); ctx.fill(); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(hx, hy - 4, hr + 3, Math.PI * 1.0, Math.PI * 2.0); ctx.fill(); }
    if (c.hairStyle === 'short') { ctx.fillStyle = '#9ca3af'; ell(hx - hr + 6, hy - 6, 7, 16); ctx.fill(); ell(hx + hr - 6, hy - 6, 7, 16); ctx.fill(); }
    if (c.hairStyle === 'curly') { ctx.fillStyle = c.hair; for (let i = -3; i <= 3; i++) { circ(hx + i * 15 + 4, hy - 34 + Math.abs(i) * 2, 12); ctx.fill(); } circ(hx - hr + 6, hy - 26, 12); ctx.fill(); circ(hx + hr - 6, hy - 26, 12); ctx.fill(); }
    if (c.hairStyle === 'pony' || c.hairStyle === 'bun' || c.hairStyle === 'bob') { ctx.fillStyle = c.hair; ctx.beginPath(); ctx.moveTo(hx - hr - 2, hy); ctx.quadraticCurveTo(hx - 20, hy - 70, hx + 30, hy - 40); ctx.quadraticCurveTo(hx + 10, hy - 30, hx - hr + 10, hy + 10); ctx.fill(); }
  }
  // face
  drawFace(hx, hy + 8, st, c);
  ctx.restore();
}

function drawFace(fx, fy, st, c) {
  const mood = st.mood || 'neutral', t = st.t;
  const look = clamp(st.look || 0, -1, 1);
  const blink = blinkAt(t, st.seed);
  const ex = 21, ey = -10;
  for (const side of [-1, 1]) {
    const x = fx + side * ex, y = fy + ey;
    if (blink) { ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y); strokeC('#1f1a17', 3); }
    else {
      const open = mood === 'deadpan' || mood === 'bored' ? 0.55 : mood === 'shock' ? 1.25 : 1;
      ell(x, y, 10, 11 * open); fillC('#fff');
      const py = mood === 'eyeroll' ? -6 : mood === 'thinking' ? -4 : 0;
      circ(x + look * 4, y + py + (open < 1 ? 2 : 0), 5.5); fillC('#1f1a17');
      if (open < 1) { ctx.fillStyle = c.skin || '#8b5cf6'; ctx.fillRect(x - 11, y - 12, 22, 7); }
    }
    // brows
    const [bi, bo] = brows(mood);
    ctx.beginPath(); ctx.moveTo(x - side * 3 - side * 8 + side * 0, y - 18 + bo * (side === -1 ? 1 : 0) + bi * (side === 1 ? 1 : 0));
    const inner = [x - side * 10, y - 18 + bi], outer = [x + side * 11, y - 18 + bo];
    ctx.beginPath(); ctx.moveTo(inner[0], inner[1]); ctx.lineTo(outer[0], outer[1]); ctx.lineCap = 'round'; strokeC('#1f1a17', 4.5);
  }
  if (c.glasses === 'round') { for (const s of [-1, 1]) { circ(fx + s * ex, fy + ey, 15); strokeC('#2d1b4e', 3); } ctx.beginPath(); ctx.moveTo(fx - 6, fy + ey); ctx.lineTo(fx + 6, fy + ey); strokeC('#2d1b4e', 3); }
  if (c.glasses === 'rect') { for (const s of [-1, 1]) { rr(fx + s * ex - 15, fy + ey - 11, 30, 22, 5); strokeC('#111', 3); } ctx.beginPath(); ctx.moveTo(fx - 6, fy + ey); ctx.lineTo(fx + 6, fy + ey); strokeC('#111', 3); }
  // nose
  ctx.beginPath(); ctx.moveTo(fx, fy - 2); ctx.quadraticCurveTo(fx + 6, fy + 10, fx - 1, fy + 12); strokeC('rgba(0,0,0,0.25)', 3);
  if (c.beard) { ctx.fillStyle = c.hair; ctx.beginPath(); ctx.moveTo(fx - 50, fy - 6); ctx.quadraticCurveTo(fx - 46, fy + 52, fx, fy + 56); ctx.quadraticCurveTo(fx + 46, fy + 52, fx + 50, fy - 6);
    ctx.quadraticCurveTo(fx + 40, fy + 34, fx, fy + 38); ctx.quadraticCurveTo(fx - 40, fy + 34, fx - 50, fy - 6); ctx.fill(); ctx.fillStyle = c.hair; ctx.beginPath(); ctx.ellipse(fx, fy + 19, 18, 6, 0, Math.PI, 0); ctx.fill(); }
  if (c.mo) { ctx.fillStyle = '#2a211d'; ctx.beginPath(); ctx.ellipse(fx, fy + 19, 18, 6, 0, Math.PI, 0); ctx.fill(); }
  // mouth
  const my = fy + 28, m = st.mouth || 0;
  if (m > 0.05) {
    const w = 15 + m * 4, h = 3 + m * 15;
    ell(fx, my + h / 3, w, h); fillC('#5a1f22');
    ctx.save(); ell(fx, my + h / 3, w, h); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(fx - w, my + h / 3 - h, w * 2, 4); ell(fx, my + h / 3 + h, w * 0.7, h * 0.6); fillC('#e66b7a'); ctx.restore();
  } else {
    ctx.beginPath();
    if (['happy', 'excited', 'smug'].includes(mood)) { ctx.moveTo(fx - 16, my); ctx.quadraticCurveTo(fx + (mood === 'smug' ? 6 : 0), my + 14, fx + 16, my - (mood === 'smug' ? 6 : 0)); }
    else if (['sad', 'worried', 'annoyed'].includes(mood)) { ctx.moveTo(fx - 13, my + 6); ctx.quadraticCurveTo(fx, my - 4, fx + 13, my + 6); }
    else if (mood === 'shock') { ell(fx, my + 4, 8, 11); fillC('#5a1f22'); ctx.beginPath(); }
    else { ctx.moveTo(fx - 12, my + 2); ctx.lineTo(fx + 12, my + 2); }
    ctx.lineCap = 'round'; strokeC('#4a1d1d', 4);
  }
}

// Lola: Pablo's Sevillian grammar parrot, drawn front-on on her own wooden perch stand.
// The lower beak opens with the voice envelope; head bobs and tilts; wings gesture while teaching.
function drawLola(x, st, opts = {}) {
  const t = st.t, m = st.mouth || 0, mood = st.mood || 'neutral';
  const look = clamp(st.look || 0, -1, 1);
  ctx.save(); ctx.translate(x, GROUND);
  if (!opts.noPerch) {
    ell(0, 2, 66, 12); fillC('rgba(0,0,0,0.2)');
    ell(0, -6, 52, 12); fillC('#57534e'); ell(0, -10, 44, 9); fillC('#78716c');
    ctx.fillStyle = '#92400e'; rr(-7, -262, 14, 254, 5); ctx.fill();
    ctx.fillStyle = '#b45309'; rr(-80, -272, 160, 15, 7); ctx.fill(); ctx.fillStyle = '#d97706'; rr(-80, -272, 160, 5, 3); ctx.fill();
    ctx.fillStyle = '#e5e7eb'; rr(52, -262, 22, 16, 5); ctx.fill(); ctx.fillStyle = '#fbbf24'; ell(63, -261, 9, 4); ctx.fill(); // seed cup
  }
  const hop = st.talking ? Math.abs(Math.sin(t * 7)) * m * 3 : 0;
  ctx.translate(0, -hop + Math.sin(t * 1.9) * 1.2);
  // tail feathers hang below the perch
  for (const [dx, col, rot, len] of [[-12, '#dc2626', 0.16, 96], [0, '#2563eb', 0, 112], [12, '#facc15', -0.16, 92]]) {
    ctx.save(); ctx.translate(dx, -280); ctx.rotate(rot + Math.sin(t * 1.3 + dx) * 0.03); ell(0, len / 2, 10, len / 2); fillC(col); ctx.restore(); }
  // body
  const g = ctx.createLinearGradient(0, -390, 0, -250); g.addColorStop(0, '#4ade80'); g.addColorStop(1, '#15803d');
  ell(0, -318, 46, 66); ctx.fillStyle = g; ctx.fill();
  ell(0, -304, 28, 44); fillC('#86efac');
  // wings (one lifts to gesture while she teaches)
  const gest = st.talking && ['teach', 'excited', 'smug', 'annoyed', 'shock'].includes(mood);
  for (const side of [-1, 1]) {
    let ang = side * 0.22; if (gest && side === 1) ang = 0.22 + 0.6 + Math.sin(t * 3.4) * 0.3 * (0.4 + m);
    if (mood === 'shock') ang = side * 1.1;
    ctx.save(); ctx.translate(side * 34, -360); ctx.rotate(-ang * (side === 1 ? 1 : 1) * (side === 1 ? 1 : 1));
    ell(0, 44, 19, 52); fillC('#15803d'); ell(0, 74, 14, 26); fillC('#2563eb'); ell(0, 92, 9, 14); fillC('#dc2626');
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(-10, 20 + k * 14); ctx.quadraticCurveTo(0, 28 + k * 14, 10, 20 + k * 14); strokeC('rgba(255,255,255,0.25)', 2); }
    ctx.restore(); }
  // feet gripping the perch
  for (const fx of [-16, 16]) { for (const d of [-7, 0, 7]) { ell(fx + d, -268, 4, 8); fillC('#78716c'); } }
  // polka-dot flamenco neckerchief
  ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.moveTo(-34, -372); ctx.quadraticCurveTo(0, -362, 34, -372); ctx.lineTo(0, -336); ctx.closePath(); ctx.fill();

function findSeg(t) { const S = TL.segments; let lo = 0, hi = S.length - 1; if (t < S[0].t0) return S[0]; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (S[m].t0 <= t) lo = m; else hi = m - 1; } return S[lo]; }
function boardSide(seg) { const sp = seg.kind === 'line' ? speakerAt(seg) : null; if (seg.scene && seg.scene.startsWith('confess')) return 'right'; if (!sp) return 'right'; return sp.x < 640 ? 'right' : 'left'; }

const CAST = ['dad', 'mum', 'pablo', 'tara', 'lola'];
const CAST_MOOD = { dad: 'smug', mum: 'happy', pablo: 'excited', tara: 'deadpan', lola: 'smug' };
function drawTitle(seg, t) {
  const k = t - seg.t0;
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#dc2626'); g.addColorStop(0.55, '#f97316'); g.addColorStop(1, '#facc15'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) { const x = (hash(i) * W + k * 40 * (hash(i + 1) + 0.3)) % W, y = hash(i + 2) * H; text(['¡', '¿', 'ñ', 'á', 'olé'][i % 5], x, y, 20 + hash(i + 3) * 30, 'rgba(255,255,255,0.18)'); }
  const word = seg.title; ctx.font = '700 112px Fredoka'; const tw = ctx.measureText(word).width; let x = 640 - tw / 2;
  const hl = word.indexOf('CAOS');
  for (let i = 0; i < word.length; i++) { const ch = word[i]; ctx.font = '700 112px Fredoka'; const cw = ctx.measureText(ch).width; const kk = back((k - 0.1 - i * 0.05) / 0.4);
    if (kk > 0 && ch !== ' ') { ctx.save(); ctx.translate(x + cw / 2, 240); ctx.scale(kk, kk); ctx.rotate(Math.sin(k * 3 + i) * 0.04); text(ch, 0, 0, 112, hl >= 0 && i >= hl && i < hl + 4 ? '#fde047' : '#fff', { stroke: '#7f1d1d', sw: 14 }); ctx.restore(); }
    x += cw; }
  const sk = ease((k - 1.2) / 0.5); ctx.globalAlpha = sk; text(seg.sub, 640, 340, 36, '#fff', { stroke: '#7f1d1d', sw: 7 }); ctx.globalAlpha = 1;
  CAST.forEach((id, i) => { const kk = back((k - 1.6 - i * 0.18) / 0.4); if (kk <= 0) return;
    ctx.save(); ctx.translate(240 + i * 200, 720); ctx.scale(0.6 * kk, 0.6 * kk); ctx.translate(0, -GROUND - 40);
    drawChar(id, 0, { t, seed: i * 11, mood: CAST_MOOD[id], look: 0 }); ctx.restore(); });
}
function drawCard(seg, t) {
  const k = t - seg.t0;
  ctx.fillStyle = '#111827'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#dc2626'; ctx.fillRect(0, 296, W * ease(k / 0.4), 6); ctx.fillStyle = '#fde047'; ctx.fillRect(0, 302, W * ease(k / 0.4), 8); ctx.fillStyle = '#dc2626'; ctx.fillRect(0, 310, W * ease(k / 0.4), 6);
  const kk = back(k / 0.5); ctx.save(); ctx.translate(640, 250); ctx.scale(kk, kk); drawRich(seg.text, 0, 0, 64, '#fff', { weight: 700, maxW: 1180, min: 30 }); ctx.restore();
  ctx.globalAlpha = ease((k - 0.5) / 0.4); drawRich(seg.sub, 640, 370, 32, '#fde047', { weight: 500, maxW: 1180, min: 18, esColor: '#fef9c3' }); ctx.globalAlpha = 1;
  if (seg.text === '¡QUÉ CAOS!') { CAST.forEach((id, i) => { ctx.save(); ctx.translate(290 + i * 175, 720); ctx.scale(0.42, 0.42); ctx.translate(0, -GROUND - 30); drawChar(id, 0, { t, seed: i, mood: 'happy', look: 0 }); ctx.restore(); }); }
}
function drawChallenge(seg, t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#14532d'); g.addColorStop(1, '#166534'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  text(`PAUSE CHALLENGE  #${seg.n}`, 640, 66, 40, '#fde047');
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; rr(80, 116, 1120, 200, 20); ctx.fill();
  let qs = 46, ql = richWrap(seg.q, 1040, qs, 'Fredoka', 700); while (ql.length > 3 && qs > 30) { qs -= 2; ql = richWrap(seg.q, 1040, qs, 'Fredoka', 700); }
  ql.forEach((ln, i, arr) => drawRichLine(ln, 640, 216 - (arr.length - 1) * qs * 0.6 + i * qs * 1.2, qs, '#fff', { weight: 700 }));
  const host = TL.host || 'lola';
  const st = { t, seed: 5, mood: seg.phase === 'a' ? 'smug' : 'bored', look: -0.5 };
  if (seg.phase !== 'count') { const i = Math.floor((t - seg.say0) * TL.fps); st.talking = true; st.mouth = i >= 0 && i < seg.env.length ? seg.env[i] : 0; }
  ctx.save(); ctx.translate(1140, 720); ctx.scale(0.62, 0.62); ctx.translate(0, -GROUND); drawChar(host, 0, st); ctx.restore();
  if (seg.phase === 'count') {
    const k = t - seg.t0, n = Math.max(1, 5 - Math.floor(k));
    ctx.beginPath(); ctx.arc(640, 470, 110, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - (k % 1))); strokeC('#fde047', 16);
    text(String(n), 640, 475, 120, '#fff'); text('pause now if you need longer!', 640, 640, 26, '#bbf7d0', { weight: 500 });
  }
  if (seg.phase === 'a') {
    const k = back((t - seg.t0) / 0.5);
    let as = 76; setFont(as, 'Fredoka', 700); while (lineW(richWords(seg.a)) > 880 && as > 34) { as -= 2; setFont(as, 'Fredoka', 700); }
    const bw = Math.max(520, lineW(richWords(seg.a)) + 90);
    ctx.save(); ctx.translate(540, 430); ctx.scale(k, k);
    ctx.fillStyle = '#1d4ed8'; rr(-bw / 2, -70, bw, 140, 24); ctx.fill(); strokeC('#fde047', 5); drawRich(seg.a, 0, 2, as, '#fff', { weight: 700 }); ctx.restore();
    ctx.globalAlpha = ease((t - seg.t0 - 0.6) / 0.5); drawRich(seg.work, 540, 580, 36, '#e0f2fe', { font: 'Hand', weight: 400, maxW: 960, min: 20 }); ctx.globalAlpha = 1;
  }
  if (seg.phase === 'q') text('Think…', 640, 470, 50, 'rgba(255,255,255,0.4)');
  if (seg.subs !== undefined && seg.phase !== 'count') { const s2 = Object.assign({}, seg, { subs: [{ t: seg.say0, text: seg.text }] }); drawSubsSmall(s2, t); }
}
function drawSubsSmall(seg, t) { if (t < seg.say0) return; const lines = richWrap(seg.subs[0].text, 860, 24, 'Fredoka', 500); const h = 20 + lines.length * 30, y = H - h - 14; ctx.fillStyle = 'rgba(0,0,0,0.6)'; rr(60, y, 900, h, 12); ctx.fill(); lines.forEach((l, i) => drawRichLine(l, 510, y + 25 + i * 30, 24, '#fff', { weight: 500 })); }

function drawFreeze(seg, t) {
  const ref = TL.segments[seg.ref]; const k = t - seg.t0;
  ctx.save(); ctx.filter = 'grayscale(0.85) contrast(1.1)';
  drawStage(ref, seg.hold, { zoom: 1 + ease(k / 0.3) * 0.08 }); ctx.restore();
  ctx.fillStyle = 'rgba(255,240,200,0.12)'; ctx.fillRect(0, 0, W, H);
  const kk = back((k - 0.25) / 0.35); if (kk > 0) { ctx.save(); ctx.translate(640, 470); ctx.rotate(-0.06); ctx.scale(kk, kk);
    ctx.fillStyle = '#dc2626'; rr(-330, -60, 660, 120, 14); ctx.fill(); drawRich(seg.text, 0, 4, 70, '#fff', { weight: 700, maxW: 620, min: 30 }); ctx.restore(); }
  const k2 = ease((k - 1.0) / 0.3); if (k2 > 0 && seg.narrator) { ctx.globalAlpha = k2; ctx.fillStyle = '#111'; rr(240, 600, 800, 64, 10); ctx.fill(); drawRich(seg.narrator, 640, 632, 30, '#fde047', { weight: 700, maxW: 770, min: 16, esColor: '#fff' }); ctx.globalAlpha = 1; }
}

window.renderAt = function (t) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const seg = findSeg(t);
  if (seg.kind === 'title') return drawTitle(seg, t);
  if (seg.kind === 'card') return drawCard(seg, t);
  if (seg.kind === 'challenge') return drawChallenge(seg, t);
  if (seg.kind === 'freeze') return drawFreeze(seg, t);
  if (!seg.scene) return;
  drawStage(seg, t);
  drawBoard(seg.board, t, boardSide(seg));
  if (seg.caption) drawLowerThird(seg.caption, t - firstOf(seg).t0);
  if (seg.kind === 'line') drawSubs(seg, t);
  // fade from black at very start
  if (t < 0.6) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (t > TL.duration - 0.6) { ctx.fillStyle = `rgba(0,0,0,${(t - TL.duration + 0.6) / 0.6})`; ctx.fillRect(0, 0, W, H); }
};
const _first = new Map();
function firstOf(seg) { const key = seg.scene + '|' + seg.caption; if (_first.has(key + seg.t0)) return _first.get(key + seg.t0);
  const S = TL.segments; let i = S.indexOf(seg); while (i > 0 && S[i - 1].scene === seg.scene && S[i - 1].caption === seg.caption) i--; _first.set(key + seg.t0, S[i]); return S[i]; }

window.init = async function (tl) { TL = tl;
  const svgs = new Set(); for (const sg of tl.segments) for (const b of sg.board || []) if (b.svg) svgs.add(b.svg);
  await Promise.all([...svgs].map(sv => new Promise(res => { const im = new Image(); im.onload = () => { SVG_IMG.set(sv, im); res(); }; im.onerror = () => { console.error('SVGFAIL ' + sv.slice(0, 80)); res(); }; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sv); }))); await document.fonts.load('700 40px Fredoka'); await document.fonts.load('400 30px Hand'); await document.fonts.ready; return true; };
window.frameJpeg = function (t, q) { window.renderAt(t); return cv.toDataURL('image/jpeg', q || 0.9); };
</script>
